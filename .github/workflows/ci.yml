name: SHADOW CI

on:
  push:
    branches: [main, develop, "rearchitect/*", "hardening/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Run ruff linter
        run: ruff check core/ tests/ --output-format=github
      
      - name: Run ruff formatter check
        run: ruff format --check core/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=core --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install package
        run: pip install -e .
      
      - name: Test CLI --help
        run: |
          ./shadow --help
          ./shadow hunt --help
          ./shadow top --help
          ./shadow export --help
          ./shadow stats --help
          ./shadow query --help
      
      - name: Test module imports
        run: |
          python -c "from core import Database, Scorer, Orchestrator"
          python -c "from core.db import Asset, Service, Endpoint, Finding"
          python -c "from core.scorer import PARAM_SCORES, PATH_SCORES"
      
      - name: Test database creation
        run: |
          python -c "
          from core.db import Database
          import tempfile
          import os
          
          with tempfile.NamedTemporaryFile(suffix='.db', delete=False) as f:
              db = Database(f.name)
              
              # Add test data
              asset_id = db.add_asset('test.example.com', source='ci')
              assert asset_id > 0
              
              service_id = db.add_service(asset_id, port=443, status_code=200)
              assert service_id > 0
              
              endpoint_id = db.add_endpoint(service_id, '/api/test', interesting_score=5)
              assert endpoint_id > 0
              
              stats = db.get_stats()
              assert stats['assets'] == 1
              assert stats['endpoints'] == 1
              
              db.close()
              os.unlink(f.name)
              
          print('✓ Database smoke test passed')
          "
      
      - name: Test scoring
        run: |
          python -c "
          from core.scorer import Scorer, get_priority
          
          scorer = Scorer()
          
          # Test high-score endpoint
          result = scorer.score_endpoint('/admin/config', {'cmd': 'ls', 'file': 'x'})
          assert result.total >= 10, f'Expected >= 10, got {result.total}'
          assert 'admin' in result.tags
          assert 'rce' in result.tags
          
          # Test noise
          result = scorer.score_endpoint('/static/app.js', {})
          assert result.total == 0
          
          # Test priority
          assert get_priority(10) == 'critical'
          assert get_priority(7) == 'high'
          assert get_priority(0) == 'noise'
          
          print('✓ Scoring smoke test passed')
          "

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install bandit
        run: pip install bandit
      
      - name: Run bandit security linter
        run: bandit -r core/ -ll --format json --output bandit-report.json || true
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
      
      - name: Check for high severity issues
        run: |
          python -c "
          import json
          with open('bandit-report.json') as f:
              report = json.load(f)
          high_issues = [r for r in report.get('results', []) if r.get('issue_severity') == 'HIGH']
          if high_issues:
              print('High severity issues found:')
              for issue in high_issues:
                  print(f\"  - {issue['filename']}:{issue['line_number']}: {issue['issue_text']}\")
              exit(1)
          print('No high severity issues found')
          "

  release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install build tools
        run: pip install build
      
      - name: Build package
        run: python -m build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadow-dist
          path: dist/
      
      - name: Create release archive
        run: |
          mkdir -p release
          cp -r core/ release/
          cp -r wordlists/ release/
          cp shadow install_tools.sh README.md pyproject.toml release/
          cd release && zip -r ../shadow-release.zip .
      
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: shadow-release
          path: shadow-release.zip
