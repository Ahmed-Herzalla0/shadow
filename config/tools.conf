# ═══════════════════════════════════════════════════════════════════════════════
# SHADOW v5 - Tools Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Set to "true" to enable, "false" to disable

# ─────────────────────────────────────────────────────────────────────────────
# PROXY SETTINGS (Burp Suite / ZAP / etc.)
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_PROXY="false"
PROXY_URL="http://127.0.0.1:8080"

# ─────────────────────────────────────────────────────────────────────────────
# TOOL TOGGLES - Enable/Disable individual tools
# ─────────────────────────────────────────────────────────────────────────────

# Intel Module (01)
ENABLE_AMASS="false"
ENABLE_METABIGOR="true"
ENABLE_ASNMAP="true"
ENABLE_MAPCIDR="true"
ENABLE_WHOIS="true"

# Subdomain Enumeration (02)
ENABLE_SUBFINDER="true"
ENABLE_ASSETFINDER="true"
ENABLE_FINDOMAIN="true"
ENABLE_GITHUB_SUBDOMAINS="true"
ENABLE_CHAOS="true"
ENABLE_GOTATOR="true"
ENABLE_ALTERX="true"

# DNS Resolution (03)
ENABLE_DNSX="true"
ENABLE_MASSDNS="true"
ENABLE_PUREDNS="true"

# Port Scanning (04)
ENABLE_NAABU="true"
ENABLE_MASSCAN="true"
ENABLE_NMAP="true"

# HTTP Probing (05)
ENABLE_HTTPX="true"

# Content Discovery (06)
ENABLE_FFUF="true"
ENABLE_FEROXBUSTER="true"
ENABLE_DIRSEARCH="true"

# JavaScript Analysis (07)
ENABLE_KATANA="true"
ENABLE_SUBJS="true"
ENABLE_LINKFINDER="true"
ENABLE_SECRETFINDER="true"
ENABLE_JSA="true"

# URL & Params (08)
ENABLE_GAU="true"
ENABLE_WAYBACKURLS="true"
ENABLE_HAKRAWLER="true"
ENABLE_PARAMSPIDER="true"
ENABLE_ARJUN="true"
ENABLE_GF="true"

# Vulnerability Scanning (09)
ENABLE_NUCLEI="true"
ENABLE_DALFOX="true"
ENABLE_SQLMAP="true"
ENABLE_COMMIX="true"
ENABLE_CRLFUZZ="true"
ENABLE_CORSY="true"

# Visual/Screenshot (10)
ENABLE_GOWITNESS="true"
ENABLE_AQUATONE="true"
ENABLE_EYEWITNESS="true"

# ─────────────────────────────────────────────────────────────────────────────
# SUBDOMAIN ENUMERATION OPTIONS
# ─────────────────────────────────────────────────────────────────────────────
SUBFINDER_OPTS="-all -recursive"
AMASS_OPTS="-passive"
ASSETFINDER_OPTS="--subs-only"
FINDOMAIN_OPTS=""

# ─────────────────────────────────────────────────────────────────────────────
# DNS RESOLUTION
# ─────────────────────────────────────────────────────────────────────────────
DNSX_OPTS="-a -aaaa -cname -resp"
MASSDNS_RESOLVERS="/usr/share/massdns/lists/resolvers.txt"

# ─────────────────────────────────────────────────────────────────────────────
# PORT SCANNING
# ─────────────────────────────────────────────────────────────────────────────
NAABU_PORTS="top-1000"
NAABU_OPTS="-c 50 -rate 1000"
MASSCAN_RATE="10000"

# ─────────────────────────────────────────────────────────────────────────────
# HTTP PROBING
# ─────────────────────────────────────────────────────────────────────────────
HTTPX_OPTS="-title -tech-detect -status-code -follow-redirects"
HTTPX_THREADS="50"

# ─────────────────────────────────────────────────────────────────────────────
# CONTENT DISCOVERY
# ─────────────────────────────────────────────────────────────────────────────
FFUF_THREADS="40"
FFUF_OPTS="-mc 200,201,301,302,403,405 -recursion -recursion-depth 2"
FEROXBUSTER_THREADS="50"

# ─────────────────────────────────────────────────────────────────────────────
# JAVASCRIPT ANALYSIS
# ─────────────────────────────────────────────────────────────────────────────
SUBJS_OPTS=""
LINKFINDER_OPTS="-o cli"

# ─────────────────────────────────────────────────────────────────────────────
# VULNERABILITY SCANNING
# ─────────────────────────────────────────────────────────────────────────────
NUCLEI_SEVERITY="critical,high,medium"
NUCLEI_RATE="150"
NUCLEI_OPTS="-rl 150 -c 25"
DALFOX_OPTS="--skip-bav"

# ─────────────────────────────────────────────────────────────────────────────
# SCREENSHOT
# ─────────────────────────────────────────────────────────────────────────────
GOWITNESS_OPTS="--delay 2"

# ─────────────────────────────────────────────────────────────────────────────
# INTELLIGENCE MODULE (Advanced Analysis)
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_INTELLIGENCE="true"

# Auth Surface Detection
AUTH_PATTERNS="login|logout|callback|oauth|sso|auth|token|session|register|signup|password|reset|forgot|verify|confirm|2fa|mfa|otp"

# Interesting Parameters (for IDOR/Logic bugs)
INTERESTING_PARAMS="id|user|account|org|role|admin|redirect|next|return|url|file|path|doc|page|action|cmd|exec|callback|redir|destination|target|uri|ref|source|site|view|dir|show|navigation|open|domain|continue|return_to|go|window|data|reference|key|token|name|email|type|order|no|number"

# JS Runtime Patterns (security-relevant only)
JS_SECURITY_PATTERNS="postMessage|innerHTML|outerHTML|document\.write|eval|setTimeout|setInterval|location\.|cookie|localStorage|sessionStorage|fetch\(|axios\.|XMLHttpRequest|\.open\(|window\.open|dangerouslySetInnerHTML|href\s*="

# ─────────────────────────────────────────────────────────────────────────────
# SCORING SYSTEM (Target Prioritization)
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_SCORING="true"
SCORE_200="1"
SCORE_HAS_PARAMS="2"
SCORE_AUTH_RELATED="3"
SCORE_ADMIN_PANEL="4"
SCORE_API_ENDPOINT="2"
SCORE_INTERESTING_TECH="3"

# ─────────────────────────────────────────────────────────────────────────────
# STOP CONDITIONS (Prevent Runaway Scans)
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_LIMITS="true"
ENABLE_SCOPE_FILTERING="true"
MAX_SUBDOMAINS="5000"
MAX_URLS="10000"
MAX_JS_FILES="500"
MAX_SCAN_TIME="3600"           # 1 hour max per module

# ─────────────────────────────────────────────────────────────────────────────
# CHANGE DETECTION (Delta Analysis)
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_DELTA="true"
DELTA_STORAGE_PATH="$HOME/.shadow/history"

# ─────────────────────────────────────────────────────────────────────────────
# MANUAL CHECKPOINT (Forces manual analysis)
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_CHECKPOINTS="false"     # Set to true for training mode
CHECKPOINT_AFTER_HTTP="true"
CHECKPOINT_AFTER_PARAMS="true"

# ─────────────────────────────────────────────────────────────────────────────
# BRAIN MODULE (Intelligent Analysis)
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_BRAIN="true"

# Differential behavior detection (compare with/without auth)
ENABLE_DIFF_DETECTION="true"

# Auto-stop to force manual decision
ENABLE_AUTO_STOP="false"       # Set to true for training mode

# High-value URL patterns (for prioritization)
HIGH_VALUE_PATTERNS="/api/|/v[0-9]+/|/me|/user|/admin|/export|/download|/upload|/callback|/webhook|/internal|/private|/debug|/config|/settings|/account|/profile|/order|/payment|/delete|/update|/edit|/create|/graphql"

# ─────────────────────────────────────────────────────────────────────────────
# AUTO-CLEANUP (Remove garbage after scan)
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_CLEANUP="true"
CLEANUP_AGGRESSIVE="false"     # Set to true to remove JS files and compress

# ─────────────────────────────────────────────────────────────────────────────
# ASSUMPTION BREAKER MODULE
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_ASSUMPTION_TESTS="true"

# Bypass headers to test
BYPASS_HEADERS="X-Forwarded-For|X-Original-URL|X-Rewrite-URL|X-Custom-IP-Authorization|X-Real-IP|True-Client-IP"

# HTTP methods to test
TEST_METHODS="GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD,TRACE"

# ─────────────────────────────────────────────────────────────────────────────
# BUSINESS LOGIC MODULE
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_LOGIC_TESTS="true"

# Multi-user testing (requires manual session setup)
ENABLE_MULTI_USER="true"

# Race condition testing
ENABLE_RACE_TESTS="false"      # Can be noisy, enable manually

# Session max age (seconds)
SESSION_MAX_AGE="3600"

# ─────────────────────────────────────────────────────────────────────────────
# OBSIDIAN INTEGRATION
# ─────────────────────────────────────────────────────────────────────────────
ENABLE_OBSIDIAN_REPORT="true"
OBSIDIAN_VAULT_PATH="/home/ahmad/Documents/Obsidian Vault/reports"

# Auto-open Obsidian after scan (requires obsidian CLI)
AUTO_OPEN_OBSIDIAN="false"
