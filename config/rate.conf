# ═══════════════════════════════════════════════════════════════════════════════
# SHADOW v5 - Rate Limiting Configuration
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# GLOBAL SETTINGS
# ─────────────────────────────────────────────────────────────────────────────
GLOBAL_THREADS="50"
GLOBAL_TIMEOUT="10"
GLOBAL_RETRIES="2"

# ─────────────────────────────────────────────────────────────────────────────
# RATE PROFILES
# ─────────────────────────────────────────────────────────────────────────────

# Stealth Mode (slow but safe)
STEALTH_RATE="10"
STEALTH_DELAY="2"
STEALTH_THREADS="5"

# Normal Mode (balanced)
NORMAL_RATE="100"
NORMAL_DELAY="0.5"
NORMAL_THREADS="30"

# Aggressive Mode (fast but noisy)
AGGRESSIVE_RATE="500"
AGGRESSIVE_DELAY="0"
AGGRESSIVE_THREADS="100"

# ─────────────────────────────────────────────────────────────────────────────
# PER-TOOL RATE LIMITS
# ─────────────────────────────────────────────────────────────────────────────
SUBFINDER_RATE="50"
AMASS_RATE="100"
NAABU_RATE="1000"
HTTPX_RATE="150"
NUCLEI_RATE="150"
FFUF_RATE="100"
DALFOX_RATE="50"

# ─────────────────────────────────────────────────────────────────────────────
# DELAY BETWEEN MODULES (seconds)
# ─────────────────────────────────────────────────────────────────────────────
MODULE_DELAY="2"

# ─────────────────────────────────────────────────────────────────────────────
# BURST SETTINGS
# ─────────────────────────────────────────────────────────────────────────────
BURST_SIZE="10"

# ─────────────────────────────────────────────────────────────────────────────
# NOISE DETECTION SETTINGS
# ─────────────────────────────────────────────────────────────────────────────
# When the server detects our scanning, auto-pause

# Time to pause when noise detected (seconds)
NOISE_PAUSE_TIME="60"

# Max 403 Forbidden responses before pausing
NOISE_MAX_403="10"

# Max 429 Rate Limit responses before pausing (very sensitive)
NOISE_MAX_429="3"

# Max timeouts before pausing
NOISE_MAX_TIMEOUT="5"

# Check noise status every N requests
NOISE_CHECK_INTERVAL="20"

# ─────────────────────────────────────────────────────────────────────────────
# STEALTH MODE
# ─────────────────────────────────────────────────────────────────────────────
# Enable for targets with aggressive WAF/IDS
STEALTH_MODE="false"

# Katana rate limit (requests per second)
KATANA_RATE="50"

# Nuclei rate and concurrency in stealth mode
NUCLEI_STEALTH_RATE="30"
NUCLEI_STEALTH_CONCURRENCY="5"
BURST_DELAY="1"
